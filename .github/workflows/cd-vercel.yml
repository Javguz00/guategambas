name: CD - Vercel

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Resolve production DB URLs from Vercel Postgres env
        run: |
          if [ ! -f .vercel/.env.production.local ]; then
            echo "::error::Missing .vercel/.env.production.local after vercel pull"
            exit 1
          fi

          set -a
          . .vercel/.env.production.local
          set +a

          RUNTIME_URL="${POSTGRES_PRISMA_URL:-${POSTGRES_URL:-${DATABASE_URL:-}}}"
          DIRECT_DB_URL="${POSTGRES_URL_NON_POOLING:-${DIRECT_URL:-${POSTGRES_URL:-$RUNTIME_URL}}}"

          if [ -z "$RUNTIME_URL" ]; then
            echo "::error::No production database URL found in Vercel env or GitHub secrets."
            exit 1
          fi

          if [ -z "$DIRECT_DB_URL" ]; then
            echo "::error::No direct database URL found. Ensure POSTGRES_URL_NON_POOLING exists."
            exit 1
          fi

          echo "DATABASE_URL=$RUNTIME_URL" >> "$GITHUB_ENV"
          echo "DIRECT_URL=$DIRECT_DB_URL" >> "$GITHUB_ENV"

      - name: Sync resolved DB URLs to Vercel production env
        run: |
          vercel env rm DATABASE_URL production --yes --token=${{ secrets.VERCEL_TOKEN }} || true
          vercel env rm DIRECT_URL production --yes --token=${{ secrets.VERCEL_TOKEN }} || true
          printf "%s" "$DATABASE_URL" | vercel env add DATABASE_URL production --token=${{ secrets.VERCEL_TOKEN }}
          printf "%s" "$DIRECT_URL" | vercel env add DIRECT_URL production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Prisma generate
        run: npx prisma generate

      - name: Validate production database URLs
        run: node scripts/validate-db-url.mjs

      - name: Run production migrations
        run: npx prisma migrate deploy

      - name: Build Project Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
